        * { box-sizing: border-box; margin: 0; padding: 0; }
        .app {

          background: #F6F2EA;
          font-family: 'Barlow', -apple-system, 'Segoe UI', sans-serif;
          color: #1B2A4A;
          padding-bottom: calc(40px + env(safe-area-inset-bottom));
        }
        .hero {
          background: linear-gradient(160deg, #1B2A4A 0%, #24466B 60%, #2A6F8F 100%);
          color: #fff;
          padding: 22px 18px 18px;
        }
        .trip-bar { display: flex; gap: 6px; margin-bottom: 14px; }
        .trip-bar select {
          flex: 1; min-width: 0;
          background: rgba(255,255,255,0.12); color: #fff;
          border: 1px solid rgba(255,255,255,0.3); border-radius: 10px;
          padding: 9px 10px; font-family: inherit; font-size: 14px; font-weight: 600;
        }
        .trip-bar select option { color: #1B2A4A; }
        .trip-btn {
          background: rgba(255,255,255,0.12); color: #fff;
          border: 1px solid rgba(255,255,255,0.3); border-radius: 10px;
          width: 40px; font-size: 16px; cursor: pointer; line-height: 1;
        }
        .eyebrow {
          font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
          text-transform: uppercase;
          letter-spacing: 3px;
          font-size: 12px;
          color: #F2C14E;
          font-weight: 600;
        }
        .hero h1 {
          font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
          font-size: clamp(26px, 7vw, 38px);
          line-height: 1.05;
          font-weight: 700;
          text-transform: uppercase;
          margin-top: 6px;
        }
        .hero h1 .arrow { color: #E76F51; }
        .hero .sub { font-size: 13px; opacity: 0.85; margin-top: 8px; }
        .countdown {
          margin-top: 12px;
          display: inline-block;
          background: rgba(255,255,255,0.12);
          border: 1px solid rgba(242,193,78,0.5);
          border-radius: 24px;
          padding: 8px 16px;
          font-size: 15px;
          cursor: pointer;
          user-select: none;
        }
        .countdown strong {
          font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
          font-size: 22px;
          color: #F2C14E;
          font-weight: 700;
        }
        .date-edit { margin-top: 10px; font-size: 13px; }
        .date-edit input {
          margin-left: 4px; padding: 6px 8px; border-radius: 8px;
          border: none; font-family: inherit; font-size: 13px;
        }
        .tabs {
          display: flex;
          background: #1B2A4A;
          position: sticky;
          top: 0;
          z-index: 10;
        }
        .tabs button {
          flex: 1;
          padding: 12px 4px;
          background: none;
          border: none;
          border-bottom: 3px solid transparent;
          color: rgba(255,255,255,0.65);
          font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
          font-size: 16px;
          font-weight: 600;
          text-transform: uppercase;
          letter-spacing: 1.5px;
          cursor: pointer;
        }
        .tabs button.active { color: #fff; border-bottom-color: #E76F51; }
        .content { padding: 16px 14px; max-width: 560px; margin: 0 auto; }
        .card {
          background: #fff;
          border-radius: 14px;
          box-shadow: 0 1px 4px rgba(27,42,74,0.08);
          margin-bottom: 14px;
          overflow: hidden;
        }
        .stop-head {
          display: flex;
          align-items: center;
          gap: 8px;
          padding: 12px 14px;
          background: #FBF8F2;
          border-bottom: 1px solid #EFE8DB;
        }
        .stop-title {
          font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
          font-size: 19px;
          font-weight: 700;
          text-transform: uppercase;
          letter-spacing: 0.5px;
          flex: 1;
        }
        .stop-count { font-size: 12px; color: #8A8272; }
        .icon-btn {
          background: none;
          border: none;
          font-size: 15px;
          cursor: pointer;
          color: #9AA3B5;
          padding: 4px 6px;
          line-height: 1;
        }
        .icon-btn:active { color: #1B2A4A; }
        .item {
          display: flex;
          align-items: center;
          gap: 8px;
          padding: 10px 12px;
          border-bottom: 1px solid #F3EEE4;
        }
        .item:last-child { border-bottom: none; }
        .check {
          width: 22px; height: 22px; min-width: 22px;
          border: 2px solid #C9C2B2;
          border-radius: 7px;
          background: #fff;
          cursor: pointer;
          display: flex; align-items: center; justify-content: center;
          font-size: 13px; color: #fff;
        }
        .check.on { background: #2E6B4F; border-color: #2E6B4F; }
        .item-name { flex: 1; font-size: 15px; font-weight: 500; cursor: pointer; }
        .item-name.done { text-decoration: line-through; opacity: 0.45; }
        .chip {
          font-size: 10.5px;
          font-weight: 700;
          text-transform: uppercase;
          letter-spacing: 0.5px;
          padding: 3px 8px;
          border-radius: 20px;
          white-space: nowrap;
        }
        .arrows { display: flex; flex-direction: column; }
        .arrows button {
          background: none; border: none; cursor: pointer;
          font-size: 11px; color: #B5AE9E; padding: 1px 5px; line-height: 1.2;
        }
        .arrows button:active { color: #E76F51; }
        .detail {
          padding: 10px 14px 12px 44px;
          background: #FBF8F2;
          border-bottom: 1px solid #F3EEE4;
          font-size: 13px;
        }
        .detail .note { color: #6B6455; margin-bottom: 10px; }
        .detail .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .detail select {
          padding: 6px 8px; border-radius: 8px; border: 1px solid #DED6C6;
          font-family: inherit; font-size: 13px; background: #fff; color: #1B2A4A;
        }
        .btn-danger {
          background: none; border: 1px solid #E2B4A8; color: #C0442A;
          border-radius: 8px; padding: 6px 10px; font-size: 13px;
          font-weight: 600; cursor: pointer; font-family: inherit;
        }
        .btn-main {
          background: #E76F51; color: #fff; border: none;
          border-radius: 10px; padding: 12px 18px;
          font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
          font-size: 17px; font-weight: 700; text-transform: uppercase;
          letter-spacing: 1px; cursor: pointer; width: 100%;
        }
        .btn-main:disabled { opacity: 0.55; }
        .btn-ghost {
          background: none; border: 2px dashed #D8CFBC; color: #8A8272;
          border-radius: 12px; padding: 11px; width: 100%;
          font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
          margin-bottom: 14px;
        }
        .form { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
        .form input, .form select, .form textarea, .search-bar input {
          padding: 11px 12px; border-radius: 10px; border: 1.5px solid #DED6C6;
          font-family: inherit; font-size: 16px; background: #fff; color: #1B2A4A;
          width: 100%; min-width: 0;
        }
        .form textarea { resize: vertical; min-height: 54px; }
        .empty { padding: 16px 14px; font-size: 13.5px; color: #9A927F; font-style: italic; }
        .map-card { padding: 8px 4px 0; }
        .route-map { width: 100%; height: auto; display: block; }
        .city-label { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; }
        .pos-panel { padding: 12px 16px 16px; }
        .pos-line {
          display: flex; justify-content: space-between; align-items: baseline;
          margin-bottom: 8px;
        }
        .pos-km {
          font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
          font-size: 26px; font-weight: 700;
        }
        .pos-near { font-size: 13px; color: #6B6455; }
        input[type=range] {
          width: 100%; accent-color: #E76F51; height: 26px;
        }
        .jump-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        .jump-chips button {
          border: 1px solid #DED6C6; background: #FBF8F2; color: #1B2A4A;
          border-radius: 20px; padding: 5px 11px; font-size: 12.5px;
          font-weight: 600; cursor: pointer; font-family: inherit;
        }
        .jump-chips button.here { background: #1B2A4A; color: #fff; border-color: #1B2A4A; }
        .search-bar { display: flex; gap: 8px; margin-bottom: 10px; }
        .search-bar button {
          background: #1B2A4A; color: #fff; border: none; border-radius: 10px;
          padding: 0 16px; font-size: 15px; cursor: pointer; font-family: inherit;
          font-weight: 600; white-space: nowrap;
        }
        .search-dest {
          display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
          font-size: 13.5px; color: #6B6455;
        }
        .search-dest select {
          flex: 1; padding: 8px 10px; border-radius: 8px; border: 1px solid #DED6C6;
          font-family: inherit; font-size: 13.5px; background: #fff; color: #1B2A4A;
        }
        .result { padding: 12px 14px; border-bottom: 1px solid #F3EEE4; }
        .result:last-child { border-bottom: none; }
        .result-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .result-name { font-weight: 600; font-size: 15px; flex: 1; }
        .result-desc { font-size: 13px; color: #6B6455; margin-bottom: 8px; }
        .result button {
          background: #DDEBE3; color: #2E6B4F; border: none; border-radius: 8px;
          padding: 7px 12px; font-size: 13px; font-weight: 700; cursor: pointer;
          font-family: inherit;
        }
        .result button:disabled { background: #F0EDE5; color: #A8A08D; }
        .hint { font-size: 13px; color: #9A927F; padding: 4px 2px 12px; }
        .error { font-size: 13.5px; color: #C0442A; padding: 10px 2px; }
        .spin {
          display: inline-block; width: 16px; height: 16px;
          border: 2.5px solid rgba(255,255,255,0.35); border-top-color: #fff;
          border-radius: 50%; animation: sp 0.8s linear infinite; vertical-align: -3px;
        }
        @keyframes sp { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) {
          .spin { animation: none; }
          .route-map g { transition: none !important; }
        }
        .item-meta { font-size: 11.5px; color: #9A927F; font-weight: 500; margin-top: 2px; }
        .stop-total {
          font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
          font-size: 15px; font-weight: 700; color: #2E6B4F;
          background: #DDEBE3; border-radius: 20px; padding: 2px 9px;
        }
        .view-toggle {
          display: flex; background: #EDE7DA; border-radius: 12px;
          padding: 3px; margin-bottom: 12px;
        }
        .view-toggle button {
          flex: 1; border: none; background: none; border-radius: 9px;
          padding: 9px; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
          font-size: 15px; font-weight: 700; text-transform: uppercase;
          letter-spacing: 1px; color: #8A8272; cursor: pointer;
        }
        .view-toggle button.on { background: #fff; color: #1B2A4A; box-shadow: 0 1px 3px rgba(27,42,74,0.12); }
        .transport-pick { margin-bottom: 12px; }
        .transport-label {
          font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
          font-size: 15px; font-weight: 700; text-transform: uppercase;
          letter-spacing: 1px; color: #8A8272; margin-bottom: 6px;
        }
        .transport-pick .view-toggle { margin-bottom: 8px; }
        .view-toggle.small button { font-size: 13px; letter-spacing: 0.5px; padding: 8px 4px; }

        .form-row > * { flex: 1; min-width: 0; }
        .cost-input {
          width: 80px; padding: 6px 8px; border-radius: 8px;
          border: 1px solid #DED6C6; font-family: inherit; font-size: 13px;
        }
        .day-date-label {
          display: block; font-size: 12px; font-weight: 600;

        }

          border: 1px solid #DED6C6; border-radius: 8px; background: #fff;
          font-family: inherit; font-size: 12px; color: #1B2A4A;
          padding: 4px 6px; max-width: 128px;
        }
        .day1-label {
          display: flex; align-items: center; gap: 10px;
          font-size: 14.5px; font-weight: 600; flex-wrap: wrap;
        }
        .day1-label input {
          width: auto; flex: 0 1 170px;
        }
        .day-select {
          padding: 5px 4px; border-radius: 8px; border: 1px solid #DED6C6;
          font-family: inherit; font-size: 12px; background: #fff; color: #1B2A4A;
          max-width: 62px;
        }
        .stop-rename { flex: 1; display: flex; gap: 6px; }
        .stop-rename input {
          flex: 1; padding: 7px 9px; border-radius: 8px; border: 1.5px solid #2A6F8F;
          font-family: inherit; font-size: 14px;
        }
        .stop-rename button {
          background: #2A6F8F; color: #fff; border: none; border-radius: 8px;
          padding: 0 12px; cursor: pointer; font-family: inherit; font-weight: 600;
        }

          .chip { font-size: 9.5px; padding: 3px 6px; }
          .content { padding: 12px 10px; }

          .tabs button { flex: 0 1 220px; }
          .hero { padding: 28px 24px 24px; }
          .item:hover { background: #FDFBF6; }
          .trip-bar select { max-width: 420px; }
        }
