        }
        .result { padding: 12px 14px; border-bottom: 1px solid #F3EEE4; }
        .result:last-child { border-bottom: none; }
        .result-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .result-name { font-weight: 600; font-size: 15px; flex: 1; }
        .result-desc { font-size: 13px; color: #6B6455; margin-bottom: 8px; }
        .result button {
          background: #DDEBE3; color: #2E6B4F; border: none; border-radius: 8px;
          padding: 7px 12px; font-size: 13px; font-weight: 700; cursor: pointer;
          font-family: inherit;
        }
        .result button:disabled { background: #F0EDE5; color: #A8A08D; }
        .hint { font-size: 13px; color: #9A927F; padding: 4px 2px 12px; }
        .error { font-size: 13.5px; color: #C0442A; padding: 10px 2px; }
        .spin {
          display: inline-block; width: 16px; height: 16px;
          border: 2.5px solid rgba(255,255,255,0.35); border-top-color: #fff;
          border-radius: 50%; animation: sp 0.8s linear infinite; vertical-align: -3px;
        }
        @keyframes sp { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) {
          .spin { animation: none; }
          .route-map g { transition: none !important; }
        }
        .item-meta { font-size: 11.5px; color: #9A927F; font-weight: 500; margin-top: 2px; }
        .stop-total {
          font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
          font-size: 15px; font-weight: 700; color: #2E6B4F;
          background: #DDEBE3; border-radius: 20px; padding: 2px 9px;
        }
        .view-toggle {
          display: flex; background: #EDE7DA; border-radius: 12px;
          padding: 3px; margin-bottom: 12px;
        }
        .view-toggle button {
          flex: 1; border: none; background: none; border-radius: 9px;
          padding: 9px; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
          font-size: 15px; font-weight: 700; text-transform: uppercase;
          letter-spacing: 1px; color: #8A8272; cursor: pointer;
        }
        .view-toggle button.on { background: #fff; color: #1B2A4A; box-shadow: 0 1px 3px rgba(27,42,74,0.12); }
        .transport-pick { margin-bottom: 12px; }
        .transport-label {
          font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
          font-size: 15px; font-weight: 700; text-transform: uppercase;
          letter-spacing: 1px; color: #8A8272; margin-bottom: 6px;
        }
        .transport-pick .view-toggle { margin-bottom: 8px; }
        .view-toggle.small button { font-size: 13px; letter-spacing: 0.5px; padding: 8px 4px; }
        .form-row { display: flex; gap: 10px; }
        .form-row > * { flex: 1; min-width: 0; }
        .cost-input {
          width: 80px; padding: 6px 8px; border-radius: 8px;
          border: 1px solid #DED6C6; font-family: inherit; font-size: 13px;
        }
        .day-date-label {
          display: block; font-size: 12px; font-weight: 600;
          color: #2A6F8F; letter-spacing: 0.3px; text-transform: none; margin-top: 1px;
          font-family: 'Barlow', sans-serif;
        }
        .day-date-input {
          border: 1px solid #DED6C6; border-radius: 8px; background: #fff;
          font-family: inherit; font-size: 16px; color: #1B2A4A;
          padding: 4px 6px; max-width: 150px; min-height: 32px;
          -webkit-appearance: none; appearance: none;
        }
        .item .day-date-input { max-width: 126px; }
        .date-field {
          display: flex; align-items: center; gap: 10px;
          font-size: 14.5px; font-weight: 600; color: #6B6455;
        }
        .date-field input {
          flex: 1; min-width: 0; padding: 11px 12px; border-radius: 10px;
          border: 1.5px solid #DED6C6; font-family: inherit; font-size: 16px;
          background: #fff; color: #1B2A4A; min-height: 44px;
          -webkit-appearance: none; appearance: none;
        }
        .day-select {
          padding: 5px 4px; border-radius: 8px; border: 1px solid #DED6C6;
          font-family: inherit; font-size: 12px; background: #fff; color: #1B2A4A;
          max-width: 62px;
        }
        .stop-rename { flex: 1; display: flex; gap: 6px; }
        .stop-rename input {
          flex: 1; padding: 7px 9px; border-radius: 8px; border: 1.5px solid #2A6F8F;
          font-family: inherit; font-size: 14px;
        }
        .stop-rename button {
          background: #2A6F8F; color: #fff; border: none; border-radius: 8px;
          padding: 0 12px; cursor: pointer; font-family: inherit; font-weight: 600;
        }

        /* ---------- Responsive ---------- */
        .hero-inner { max-width: 1080px; margin: 0 auto; }
        .main-col { min-width: 0; }
        .side-col { display: none; }
        .side-col.show-mobile { display: block; }
        .route-map { max-width: 460px; margin: 0 auto; }
        img, svg { max-width: 100%; }

        /* Tr\xE8s petits t\xE9l\xE9phones */
        @media (max-width: 374px) {
          .tabs button { font-size: 13px; letter-spacing: 0.5px; padding: 11px 2px; }
          .view-toggle button { font-size: 13px; letter-spacing: 0.5px; }
          .chip { font-size: 9.5px; padding: 3px 6px; }
          .content { padding: 12px 10px; }
        }

        /* Tablette */
        @media (min-width: 700px) and (max-width: 999px) {
          .content { max-width: 700px; }

          .tabs { justify-content: center; }
          .tabs button { flex: 0 1 220px; }
          .hero { padding: 28px 24px 24px; }
          .item:hover { background: #FDFBF6; }
          .trip-bar select { max-width: 420px; }
        }
